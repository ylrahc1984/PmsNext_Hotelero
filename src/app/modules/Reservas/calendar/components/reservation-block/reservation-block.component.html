<button
  type="button"
  class="reservation-block"
  [ngClass]="'state-' + block.visualState"
  [class.reservation-block--ghost]="isGhost"
  [class.reservation-block--continues-before]="block.continuesBefore"
  [class.reservation-block--continues-after]="block.continuesAfter"
  [class.reservation-block--operational]="block.reservation.isOperationalBlock"
  [style.left.px]="block.left"
  [style.width.px]="block.width"
  [attr.title]="block.tooltip"
  [attr.aria-disabled]="block.reservation.isOperationalBlock || null"
  (pointerdown)="onDragStart($event)"
  (click)="onSelect($event)"
>
  <span class="reservation-block__guest" aria-hidden="true">{{ block.label }}</span>

  <span class="reservation-block__popover" role="tooltip">
    <strong class="reservation-block__popover-name">{{ block.reservation.guestName }}</strong>
    <span class="reservation-block__popover-line">{{ getVisualStateLabel(block.visualState) }} | {{ block.reservation.source }}</span>
    <span class="reservation-block__popover-line">{{ formatDate(block.reservation.startDate) }} -> {{ formatDate(block.reservation.endDate) }}</span>
    <span class="reservation-block__popover-hint" *ngIf="!block.reservation.isOperationalBlock">Click para abrir detalle operativo</span>
    <span class="reservation-block__popover-hint" *ngIf="block.reservation.isOperationalBlock">Bloqueo operativo no asociado a una reserva</span>
  </span>
</button>
