<aside class="assignment-panel" [class.assignment-panel--collapsed]="collapsed">
  <button type="button" class="assignment-panel__rail" (click)="toggleCollapsed()" [attr.aria-expanded]="!collapsed">
    <i class="feather" [ngClass]="collapsed ? 'icon-chevrons-left' : 'icon-chevrons-right'"></i>
    <span>{{ filteredReservations.length }}</span>
  </button>

  <div class="assignment-panel__content" *ngIf="!collapsed">
    <header class="assignment-panel__header">
      <div>
        <p>Rooming</p>
        <h2>Reservas pendientes</h2>
      </div>
      <div class="assignment-panel__header-actions">
        <button
          type="button"
          class="assignment-panel__icon-btn"
          [class.assignment-panel__icon-btn--active]="showDateSettings"
          (click)="toggleDateSettings()"
          aria-label="Configurar fechas de consulta"
          title="Configurar fechas"
        >
          <i class="feather icon-settings"></i>
        </button>
        <button type="button" class="assignment-panel__icon-btn" (click)="reload()" [disabled]="isLoading" aria-label="Actualizar reservas">
          <i class="feather icon-refresh-cw"></i>
        </button>
      </div>
    </header>

    <form class="assignment-panel__date-settings" *ngIf="showDateSettings" (ngSubmit)="applyDateFilter()">
      <div class="assignment-panel__date-fields">
        <label class="assignment-panel__field">
          <span>Fecha ingreso</span>
          <input type="date" class="form-control" name="filterStartDate" [(ngModel)]="filterStartDate" />
        </label>
        <label class="assignment-panel__field">
          <span>Fecha salida</span>
          <input type="date" class="form-control" name="filterEndDate" [(ngModel)]="filterEndDate" />
        </label>
      </div>
      <button type="submit" class="assignment-panel__apply-btn" [disabled]="!filterStartDate || !filterEndDate || filterStartDate > filterEndDate || isLoading">
        Aplicar filtro
      </button>
      <small *ngIf="filterStartDate && filterEndDate && filterStartDate > filterEndDate">La fecha de salida debe ser igual o posterior al ingreso.</small>
    </form>

    <div class="assignment-panel__filters">
      <label class="assignment-panel__field">
        <span>Estado</span>
        <select class="form-control" [(ngModel)]="status" (ngModelChange)="loadReservations()">
          <option *ngFor="let option of statusOptions" [value]="option.value">{{ option.label }}</option>
        </select>
      </label>
    </div>

    <div class="assignment-panel__list">
      <button
        type="button"
        class="assignment-card"
        [class.assignment-card--selected]="selectedReservationId === reservation.id"
        [class.assignment-card--assigned]="!isAssignable(reservation)"
        *ngFor="let reservation of filteredReservations; trackBy: trackByReservation"
        (click)="selectReservation(reservation)"
      >
        <span class="assignment-card__topline">
          <strong class="assignment-card__agency" [title]="reservation.agency">{{ reservation.agency || 'Agencia no indicada' }}</strong>
          <span class="assignment-card__category">Cat. {{ reservation.categoryCode || 'N/D' }}</span>
        </span>

        <span class="assignment-card__identity">
          <strong class="assignment-card__guest" [title]="reservation.guestName">{{ reservation.guestName || 'Huésped no indicado' }}</strong>
          <small class="assignment-card__code">#{{ reservation.reservationCode }}</small>
        </span>

        <span class="assignment-card__meta">
          <span class="assignment-card__dates">
            <i class="feather icon-calendar" aria-hidden="true"></i>
            {{ formatDate(reservation.startDate) }} – {{ formatDate(reservation.endDate) }}
          </span>
          <span class="assignment-card__metric">{{ reservation.nights }}N</span>
          <span class="assignment-card__metric">{{ reservation.pax }} Pax</span>
          <span class="assignment-card__metric">{{ reservation.roomNumber }} Hab</span>
        </span>

        <span class="assignment-card__actions">
          <span>Click para ver detalle</span>
          <span class="assignment-card__drag" *ngIf="isAssignable(reservation)" (pointerdown)="onReservationPointerDown(reservation, $event)" title="Arrastrar reserva">
            <i class="feather icon-move"></i>
          </span>
          <span class="assignment-card__assigned-badge" *ngIf="!isAssignable(reservation)">
            <i class="feather icon-check-circle"></i>
            Asignada
          </span>
        </span>
      </button>

      <div class="assignment-panel__empty" *ngIf="!isLoading && errorMessage" role="alert">
        <i class="feather icon-alert-circle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="assignment-panel__empty" *ngIf="!isLoading && !errorMessage && filteredReservations.length === 0">
        <i class="feather icon-inbox"></i>
        <span>Sin reservas pendientes</span>
      </div>

      <div class="assignment-panel__empty" *ngIf="isLoading">
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        <span>Cargando reservas</span>
      </div>
    </div>
  </div>
</aside>
