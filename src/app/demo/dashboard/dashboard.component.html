<div class="dashboard-top">
  <app-welcome-card [userName]="userName"></app-welcome-card>

  <app-weather-card
    [weather]="weather"
    [loading]="loading"
    [error]="weatherError">
  </app-weather-card>
</div>

<div class="row">
  @for (sale of sales; track sale) {
    <div class="{{ sale.design }}">
      <app-card [hidHeader]="true" blockClass="dashboard-card-block dashboard-card-block--metric">
        <h6 class="mb-4">{{ sale.title }}</h6>
        <div class="row d-flex align-items-center">
          <div class="col-9">
            <h3 class="f-w-300 d-flex align-items-center m-b-0">
              <i class="feather {{ sale.icon }} f-30 m-r-10"></i>
              {{ sale.amount }}
            </h3>
          </div>
          <div class="col-3 text-end">
            <p class="m-b-0">{{ sale.percentage }}</p>
          </div>
        </div>
        <div class="m-t-30">
          <ngb-progressbar type="progress-bar {{ sale.progress_bg }}" height="7px" [value]="sale.progress"></ngb-progressbar>
        </div>
      </app-card>
    </div>
  }
</div>

<div class="row mt-4">
  <div class="col-12">
    <app-card cardTitle="Accesos Rápidos" blockClass="dashboard-card-block dashboard-card-block--compact">
      <div class="quick-actions">
        <button class="quick-action quick-action--primary" routerLink="/operaciones/reservas/nueva-v2">
          <span class="quick-action__icon">
            <i class="feather icon-plus"></i>
          </span>
          <span class="quick-action__content">
            <span class="quick-action__label">Nueva Reserva</span>
            <span class="quick-action__hint">Crea una reserva o cotizacion desde cero.</span>
          </span>
          <span class="quick-action__arrow">
            <i class="feather icon-arrow-right"></i>
          </span>
        </button>

        <button class="quick-action quick-action--amber" routerLink="/operaciones/operacion-diaria">
          <span class="quick-action__icon">
            <i class="feather icon-file-text"></i>
          </span>
          <span class="quick-action__content">
            <span class="quick-action__label">Operacion Diaria</span>
            <span class="quick-action__hint">Revisa pendientes y movimientos del dia.</span>
          </span>
          <span class="quick-action__arrow">
            <i class="feather icon-arrow-right"></i>
          </span>
        </button>

        <button class="quick-action quick-action--sky" routerLink="/operaciones/ordenes-trabajo">
          <span class="quick-action__icon">
            <i class="feather icon-clipboard"></i>
          </span>
          <span class="quick-action__content">
            <span class="quick-action__label">Ver Asignacion de Traslados</span>
            <span class="quick-action__hint">Consulta el tablero operativo y su seguimiento.</span>
          </span>
          <span class="quick-action__arrow">
            <i class="feather icon-arrow-right"></i>
          </span>
        </button>

        <button class="quick-action quick-action--emerald" routerLink="/operaciones/forecast-actividades">
          <span class="quick-action__icon">
            <i class="feather icon-users"></i>
          </span>
          <span class="quick-action__content">
            <span class="quick-action__label">Forecast de Actividades</span>
            <span class="quick-action__hint">Consulta el pronóstico de actividades futuras.</span>
          </span>
          <span class="quick-action__arrow">
            <i class="feather icon-arrow-right"></i>
          </span>
        </button>
      </div>
    </app-card>
  </div>
</div>

<div class="row mt-4">
  <div class="col-xl-6">
    <app-card cardTitle="Reservas por Estado">
      <div id="chart-reservas" style="height: 300px"></div>
    </app-card>
  </div>
  <div class="col-xl-6">
    <app-card cardTitle="Ingresos por Mes">
      <div id="chart-ingresos" style="height: 300px"></div>
    </app-card>
  </div>
</div>
