<section class="welcome-card">
  <div class="welcome-card__avatar" aria-hidden="true">{{ initials }}</div>

  <div class="welcome-card__content">
    <p class="welcome-card__eyebrow">Dashboard</p>
    <h2 class="welcome-card__title">{{ title }}, {{ userName }}</h2>
    <p class="welcome-card__description">{{ description }}</p>

    <div class="welcome-card__chips">
      <span class="welcome-card__chip">Operación diaria</span>
      <span class="welcome-card__chip">Visión rápida</span>
      <span class="welcome-card__chip">Accesos directos</span>
    </div>
  </div>
</section>
