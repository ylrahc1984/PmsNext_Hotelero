<div class="container-fluid">
  <div class="row mb-3">
    <div class="col-12">
      <ul class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/dashboard"><i class="feather icon-home"></i></a>
        </li>
        <li class="breadcrumb-item">
          <a>Administracion</a>
        </li>
        <li class="breadcrumb-item">
          <a routerLink="/administracion/configuracion">Configuracion del Sistema</a>
        </li>
        <li class="breadcrumb-item">
          <a>Departamentos</a>
        </li>
      </ul>
    </div>
  </div>
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h4 class="mb-1">
            <i class="feather icon-briefcase me-2"></i>
            Gestion de Departamentos
          </h4>
          <p class="text-muted mb-0">Administra los departamentos</p>
        </div>
        <button class="btn btn-primary" (click)="createNew()">
          <i class="feather icon-plus me-1"></i>
          Nuevo Departamento
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Departamento</th>
                  <th>Operador</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let depto of departamentos">
                  <td>
                    <span class="badge bg-light text-dark">{{ depto.idDepartamento }}</span>
                  </td>
                  <td>{{ depto.departamento }}</td>
                  <td>{{ depto.operador || '-' }}</td>
                  <td class="text-center">
                    <div class="btn-group" role="group">
                      <button class="btn btn-sm btn-outline-primary" (click)="editDepartamento(depto)" title="Editar">
                        <i class="feather icon-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-danger" (click)="deleteDepartamento(depto)" title="Eliminar">
                        <i class="feather icon-trash"></i>
                      </button>
                    </div>
                  </td>
                </tr>
                <tr *ngIf="!isLoading && departamentos.length === 0">
                  <td colspan="4" class="text-center py-4">
                    <i class="feather icon-inbox display-4 text-muted"></i>
                    <p class="text-muted mt-2">No se encontraron departamentos</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div *ngIf="isLoading" class="alert alert-light border mt-3">
            <small class="text-muted">
              <i class="feather icon-loader me-1"></i>
              Cargando departamentos...
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
