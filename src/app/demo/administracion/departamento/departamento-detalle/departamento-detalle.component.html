<div class="container-fluid">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h4 class="mb-1">
            <i class="feather icon-briefcase me-2"></i>
            {{ isEditing ? 'Editar Departamento' : 'Nuevo Departamento' }}
          </h4>
          <p class="text-muted mb-0">Completa los datos del departamento</p>
        </div>
        <button type="button" class="btn btn-secondary" (click)="goBack()">
          <i class="feather icon-arrow-left me-1"></i>
          Volver
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="row mb-4">
              <div class="col-md-8">
                <label class="form-label">Departamento <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="departamento" [class.is-invalid]="form.get('departamento')?.invalid && (form.get('departamento')?.touched || form.get('departamento')?.dirty)" placeholder="Nombre del departamento">
                <div class="invalid-feedback">El departamento es requerido.</div>
              </div>
            </div>

            <div class="row">
              <div class="col-12">
                <div class="d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-secondary" (click)="goBack()">
                    <i class="feather icon-x me-1"></i>
                    Cancelar
                  </button>
                  <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                    <i class="feather icon-save me-1"></i>
                    {{ isEditing ? 'Actualizar' : 'Crear' }}
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
