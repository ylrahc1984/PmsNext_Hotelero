<div class="container-fluid">
  <div class="row mb-3">
    <div class="col-12">
      <ul class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/dashboard"><i class="feather icon-home"></i></a>
        </li>
        <li class="breadcrumb-item">
          <a>Administracion</a>
        </li>
        <li class="breadcrumb-item">
          <a routerLink="/administracion/configuracion">Configuracion del Sistema</a>
        </li>
        <li class="breadcrumb-item">
          <a routerLink="/administracion/configuracion/tipo-cliente">Tipo de Cliente</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h4 class="mb-1">
            <i class="feather icon-users me-2"></i>
            {{ isEditing ? 'Editar Tipo de Cliente' : 'Nuevo Tipo de Cliente' }}
          </h4>
          <p class="text-muted mb-0">Completa los datos requeridos</p>
        </div>
        <button type="button" class="btn btn-secondary" (click)="goBack()">
          <i class="feather icon-arrow-left me-1"></i>
          Volver
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label">Codigo <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="codTipo"
                  [class.is-invalid]="isFieldInvalid('codTipo')"
                  placeholder="Ej: AGE, CLI"
                  maxlength="10"
                  style="text-transform: uppercase;"
                >
                <div class="invalid-feedback">El codigo es requerido.</div>
              </div>
              <div class="col-md-8">
                <label class="form-label">Descripcion <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="tipoCliente"
                  [class.is-invalid]="isFieldInvalid('tipoCliente')"
                  placeholder="Ej: CLIENTE AGENCIA"
                  maxlength="150"
                >
                <div class="invalid-feedback">La descripcion es requerida.</div>
              </div>
            </div>

            <div class="row">
              <div class="col-12">
                <div class="d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-secondary" (click)="goBack()">
                    <i class="feather icon-x me-1"></i>
                    Cancelar
                  </button>
                  <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                    <i class="feather icon-save me-1"></i>
                    {{ isEditing ? 'Actualizar' : 'Crear' }}
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
