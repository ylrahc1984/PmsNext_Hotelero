<div class="container-fluid">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h4 class="mb-1">
            <i class="feather icon-layers me-2"></i>
            {{ isEditing ? 'Editar Centro de Costo' : 'Nuevo Centro de Costo' }}
          </h4>
          <p class="text-muted mb-0">Completa los datos del centro de costo</p>
        </div>
        <button type="button" class="btn btn-secondary" (click)="goBack()">
          <i class="feather icon-arrow-left me-1"></i>
          Volver
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label">Codigo <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="codGrupo" [class.is-invalid]="isFieldInvalid('codGrupo')" placeholder="Ej: CC01">
                <div class="invalid-feedback">El codigo es requerido.</div>
              </div>
              <div class="col-md-8">
                <label class="form-label">Descripcion <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="descripcion" [class.is-invalid]="isFieldInvalid('descripcion')" placeholder="Descripcion del centro de costo">
                <div class="invalid-feedback">La descripcion es requerida.</div>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label">Tipo <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="tcCto" [class.is-invalid]="isFieldInvalid('tcCto')">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let option of tipoOptions" [value]="option.value">{{ option.label }}</option>
                </select>
                <div class="invalid-feedback">Seleccione un tipo valido.</div>
              </div>
              <div class="col-md-4">
                <label class="form-label">Impuesto <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="impuesto" [class.is-invalid]="isFieldInvalid('impuesto')">
                  <option *ngFor="let option of impuestoOptions" [value]="option.value">{{ option.label }}</option>
                </select>
                <div class="invalid-feedback">Seleccione un valor valido.</div>
              </div>
              <div class="col-md-4">
                <label class="form-label">Orden <span class="text-danger">*</span></label>
                <input type="number" class="form-control" formControlName="orden" [class.is-invalid]="isFieldInvalid('orden')" min="0">
                <div class="invalid-feedback">El orden debe ser mayor o igual a 0.</div>
              </div>
            </div>

            <div class="row">
              <div class="col-12">
                <div class="d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-secondary" (click)="goBack()">
                    <i class="feather icon-x me-1"></i>
                    Cancelar
                  </button>
                  <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                    <i class="feather icon-save me-1"></i>
                    {{ isEditing ? 'Actualizar' : 'Crear' }}
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
