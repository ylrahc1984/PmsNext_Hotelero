<div class="container-fluid">
  <div class="row mb-3">
    <div class="col-12">
      <ul class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/dashboard"><i class="feather icon-home"></i></a>
        </li>
        <li class="breadcrumb-item">
          <a>Administracion</a>
        </li>
        <li class="breadcrumb-item">
          <a routerLink="/administracion/configuracion">Configuracion del Sistema</a>
        </li>
        <li class="breadcrumb-item">
          <a routerLink="/administracion/configuracion/documento">Documentos</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h4 class="mb-1">
            <i class="feather icon-file-text me-2"></i>
            {{ isEditing ? 'Editar Documento' : 'Nuevo Documento' }}
          </h4>
          <p class="text-muted mb-0">Completa los datos requeridos</p>
        </div>
        <button type="button" class="btn btn-secondary" (click)="goBack()">
          <i class="feather icon-arrow-left me-1"></i>
          Volver
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label">Codigo <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="codigo"
                  [class.is-invalid]="isFieldInvalid('codigo')"
                  placeholder="Ej: FAC"
                  maxlength="10"
                  style="text-transform: uppercase;"
                >
                <div class="invalid-feedback">El codigo es requerido.</div>
              </div>
              <div class="col-md-8">
                <label class="form-label">Descripcion <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="descripcion"
                  [class.is-invalid]="isFieldInvalid('descripcion')"
                  placeholder="Ej: FACTURA FRONT DESK"
                  maxlength="150"
                >
                <div class="invalid-feedback">La descripcion es requerida.</div>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-3">
                <label class="form-label">Serie</label>
                <input type="number" class="form-control" formControlName="serie" min="0">
              </div>
              <div class="col-md-3">
                <label class="form-label">Numero</label>
                <input type="number" class="form-control" formControlName="numero" min="0">
              </div>
              <div class="col-md-3">
                <label class="form-label">N. Factura Electronica</label>
                <input type="number" class="form-control" formControlName="nFactElectronica" min="0">
              </div>
              <div class="col-md-3">
                <label class="form-label">Tipo Doc FE <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="tDocFE" [class.is-invalid]="isFieldInvalid('tDocFE')">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let option of tDocFeOptions" [value]="option.value">
                    {{ option.value }} - {{ option.label }}
                  </option>
                </select>
                <div class="invalid-feedback">Seleccione un tipo valido.</div>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-3">
                <label class="form-label">Visible</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" formControlName="visible">
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Auto</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" formControlName="auto">
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Compra</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" formControlName="compra">
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Venta</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" formControlName="venta">
                </div>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-3">
                <label class="form-label">Docu</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" formControlName="docu">
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Nota C</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" formControlName="notaC">
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Nota D</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" formControlName="notaD">
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Guia</label>
                <input type="number" class="form-control" formControlName="guia" min="0">
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Observaciones 1</label>
                <textarea class="form-control" formControlName="observaciones1" rows="2"></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">Observaciones 2</label>
                <textarea class="form-control" formControlName="observaciones2" rows="2"></textarea>
              </div>
            </div>

            <div class="row">
              <div class="col-12">
                <div class="d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-secondary" (click)="goBack()">
                    <i class="feather icon-x me-1"></i>
                    Cancelar
                  </button>
                  <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                    <i class="feather icon-save me-1"></i>
                    {{ isEditing ? 'Actualizar' : 'Crear' }}
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
