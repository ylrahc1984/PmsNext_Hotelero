<div class="container-fluid">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h4 class="mb-1">
            <i class="feather icon-percent me-2"></i>
            {{ isEditing ? 'Editar Impuesto' : 'Nuevo Impuesto' }}
          </h4>
          <p class="text-muted mb-0">Completa los datos requeridos del impuesto</p>
        </div>
        <button type="button" class="btn btn-secondary" (click)="goBack()">
          <i class="feather icon-arrow-left me-1"></i>
          Volver
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label">Codigo <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="codigo" [class.is-invalid]="isFieldInvalid('codigo')" placeholder="Ej: ITBIS">
                <div class="invalid-feedback">El codigo es requerido.</div>
              </div>
              <div class="col-md-8">
                <label class="form-label">Nombre <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="nombre" [class.is-invalid]="isFieldInvalid('nombre')" placeholder="Nombre del impuesto">
                <div class="invalid-feedback">El nombre es requerido.</div>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-3">
                <label class="form-label">Porcentaje <span class="text-danger">*</span></label>
                <input type="number" class="form-control" formControlName="porcentaje" [class.is-invalid]="isFieldInvalid('porcentaje')" min="0" step="0.01">
                <div class="invalid-feedback">El porcentaje debe ser mayor o igual a 0.</div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Tipo <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="tipoImpu" [class.is-invalid]="isFieldInvalid('tipoImpu')">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let option of tipoImpuOptions" [value]="option.value">{{ option.label }}</option>
                </select>
                <div class="invalid-feedback">Seleccione un tipo valido.</div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Grabado <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="grabado" [class.is-invalid]="isFieldInvalid('grabado')">
                  <option *ngFor="let option of grabadoOptions" [value]="option.value">{{ option.label }}</option>
                </select>
                <div class="invalid-feedback">Seleccione un valor valido.</div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Orden <span class="text-danger">*</span></label>
                <input type="number" class="form-control" formControlName="orden" [class.is-invalid]="isFieldInvalid('orden')" min="0">
                <div class="invalid-feedback">El orden debe ser mayor o igual a 0.</div>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Cta Contab. Venta</label>
                <input type="text" class="form-control" formControlName="ctaContav" placeholder="Cuenta contable venta">
              </div>
              <div class="col-md-6">
                <label class="form-label">Cta Contab. Compra</label>
                <input type="text" class="form-control" formControlName="ctaContac" placeholder="Cuenta contable compra">
              </div>
            </div>

            <div class="row mb-4">
              <div class="col-md-6">
                <label class="form-label">Id Tributacion</label>
                <input type="text" class="form-control" formControlName="idTributacion" placeholder="Id tributacion">
              </div>
              <div class="col-md-6">
                <label class="form-label">Cta Tarifa</label>
                <input type="text" class="form-control" formControlName="ctaRifa" placeholder="Cuenta tarifa">
              </div>
            </div>

            <div class="row">
              <div class="col-12">
                <div class="d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-secondary" (click)="goBack()">
                    <i class="feather icon-x me-1"></i>
                    Cancelar
                  </button>
                  <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                    <i class="feather icon-save me-1"></i>
                    {{ isEditing ? 'Actualizar' : 'Crear' }}
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
