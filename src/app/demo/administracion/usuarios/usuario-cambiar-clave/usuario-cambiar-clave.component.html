<div class="container-fluid">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h4 class="mb-1">
            <i class="feather icon-key me-2"></i>
            Cambiar Clave
          </h4>
          <p class="text-muted mb-0">Actualiza la clave del usuario</p>
        </div>
        <button type="button" class="btn btn-secondary" (click)="goBack()">
          <i class="feather icon-arrow-left me-1"></i>
          Volver
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" formControlName="usuario" readonly>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Nueva Clave <span class="text-danger">*</span></label>
                <input type="password" class="form-control" formControlName="nuevaClave" [class.is-invalid]="form.get('nuevaClave')?.invalid && (form.get('nuevaClave')?.touched || form.get('nuevaClave')?.dirty)">
                <div class="invalid-feedback">La nueva clave es requerida.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Confirmar Clave <span class="text-danger">*</span></label>
                <input type="password" class="form-control" formControlName="confirmarClave" [class.is-invalid]="form.get('confirmarClave')?.invalid && (form.get('confirmarClave')?.touched || form.get('confirmarClave')?.dirty)">
                <div class="invalid-feedback">La confirmacion es requerida.</div>
              </div>
            </div>

            <div class="row">
              <div class="col-12">
                <div class="d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-secondary" (click)="goBack()">
                    <i class="feather icon-x me-1"></i>
                    Cancelar
                  </button>
                  <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                    <i class="feather icon-save me-1"></i>
                    Guardar
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
