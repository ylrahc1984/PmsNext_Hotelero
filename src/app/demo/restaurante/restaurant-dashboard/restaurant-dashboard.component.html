<section class="restaurant-dashboard" aria-label="Centro operativo restaurante">
  <section class="kpi-section" aria-label="KPIs Restaurante">
    <div class="section-header">
      <span class="section-eyebrow">PMSNEXT HOTELERO</span>
      <h1>KPIs Restaurante</h1>
    </div>

    <div class="kpi-grid">
      <article class="kpi-card" *ngFor="let kpi of kpis" [ngClass]="'kpi-card--' + kpi.accent">
        <span class="kpi-icon"><i class="feather" [ngClass]="kpi.icon"></i></span>
        <div class="kpi-content">
          <p>{{ kpi.label }}</p>
          <strong>{{ kpi.value }}</strong>
          <small>{{ kpi.detail }}</small>
        </div>
      </article>
    </div>
  </section>

  <section class="operations-section" aria-label="Salones y plano de mesas">
    <main class="panel panel--floor" aria-label="Plano de mesas">
      <header class="panel-header panel-header--stacked">
        <h2>Plano de Mesas</h2>
      </header>

      <app-restaurant-floor-plan class="floor-plan-shell"></app-restaurant-floor-plan>
    </main>

    <aside class="panel panel--salones" aria-label="Panel de salones">
      <header class="panel-header panel-header--compact">
        <h2>Salones</h2>
      </header>

      <div class="salones-list">
        <article class="salon-card" *ngFor="let salon of salones">
          <h3 class="salon-card__name">
            <span class="salon-dot"></span>
            <span>{{ salon.nombre }}</span>
          </h3>
          <i class="feather icon-chevron-right" aria-hidden="true"></i>
        </article>

        <article class="salon-card salon-card--room-service">
          <h3 class="salon-card__name">
            <span class="salon-dot"></span>
            <span>Room Service</span>
          </h3>
          <i class="feather icon-chevron-right" aria-hidden="true"></i>
        </article>
      </div>
    </aside>
  </section>

  <section class="operational-status" aria-label="Estado operativo restaurante">
    <header class="panel-header">
      <h2>Estado Operativo</h2>
    </header>

    <div class="status-grid">
      <article class="status-card" *ngFor="let item of estadoOperativo">
        <div class="status-card__title">
          <i class="feather" [ngClass]="item.icon"></i>
          <span>{{ item.titulo }}</span>
        </div>
        <strong>{{ item.valor }}</strong>
        <small>{{ item.detalle }}</small>
      </article>

      <button type="button" class="status-primary-action">Ver Pedidos</button>
    </div>
  </section>
</section>
