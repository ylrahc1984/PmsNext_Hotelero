<div class="chofer-form-wrapper">
  <div class="form-header mb-3">
    <h6 class="mb-0">
      <i class="feather icon-user"></i> {{ isEdit ? 'Editar Chofer' : 'Nuevo Chofer' }}
    </h6>
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="row">
      <!-- Nombre -->
      <div class="col-md-12 mb-3">
        <label class="form-label">
          Nombre Completo <span class="text-danger">*</span>
        </label>
        <input 
          class="form-control" 
          formControlName="nombre" 
          placeholder="Juan Pérez López"
          [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched">
        <div class="invalid-feedback" *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
          El nombre es requerido
        </div>
      </div>

      <!-- Tipo de Licencia -->
      <div class="col-md-6 mb-3">
        <label class="form-label">
          Tipo de Licencia <span class="text-danger">*</span>
        </label>
        <input 
          class="form-control" 
          formControlName="tipoLicencia" 
          placeholder="A1, A2, B1, etc."
          [class.is-invalid]="form.get('tipoLicencia')?.invalid && form.get('tipoLicencia')?.touched">
        <div class="invalid-feedback" *ngIf="form.get('tipoLicencia')?.invalid && form.get('tipoLicencia')?.touched">
          El tipo de licencia es requerido
        </div>
      </div>

      <!-- Teléfono -->
      <div class="col-md-6 mb-3">
        <label class="form-label">Teléfono</label>
        <input 
          class="form-control" 
          formControlName="telefono" 
          placeholder="809-555-1234">
      </div>

      <!-- Email -->
      <div class="col-md-12 mb-3">
        <label class="form-label">Email</label>
        <input 
          class="form-control" 
          type="email" 
          formControlName="email" 
          placeholder="jperez@example.com"
          [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched">
        <div class="invalid-feedback" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Email inválido
        </div>
      </div>

      <!-- Observaciones -->
      <div class="col-md-12 mb-3">
        <label class="form-label">Observaciones</label>
        <textarea 
          class="form-control" 
          formControlName="observaciones" 
          rows="3"
          placeholder="Observaciones sobre el chofer (experiencia, certificaciones, etc.)"></textarea>
      </div>

      <!-- Estado -->
      <div class="col-md-12 mb-3">
        <label class="form-label">Estado</label>
        <div class="form-check form-switch">
          <input 
            class="form-check-input" 
            type="checkbox" 
            [checked]="form.get('estado')?.value === 'ACT'"
            (change)="form.patchValue({ estado: $any($event.target).checked ? 'ACT' : 'INA' })">
          <label class="form-check-label">
            {{ form.get('estado')?.value === 'ACT' ? 'Activo' : 'Inactivo' }}
          </label>
        </div>
      </div>
    </div>

    <!-- Botones -->
    <div class="form-actions mt-3">
      <button 
        type="button" 
        class="btn btn-outline-secondary" 
        (click)="cancelar()" 
        [disabled]="isLoading">
        <i class="feather icon-x"></i> Cancelar
      </button>
      <button 
        type="submit" 
        class="btn btn-primary" 
        [disabled]="isLoading || form.invalid">
        <i class="feather icon-save"></i> {{ isEdit ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
