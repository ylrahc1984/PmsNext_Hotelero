<div class="modal" tabindex="-1" role="dialog" [ngClass]="{ show: open }" *ngIf="open" style="display: block">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title }}</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="onCancel()"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">{{ message }}</p>
      </div>
      <div class="modal-footer d-flex justify-content-between flex-wrap gap-2">
        <button type="button" class="btn btn-outline-secondary" (click)="onCancel()" [disabled]="busy">
          {{ cancelText }}
        </button>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-danger" (click)="onDanger()" [disabled]="busy">
            {{ dangerText }}
          </button>
          <button type="button" class="btn btn-primary" (click)="onConfirm()" [disabled]="busy">
            {{ confirmText }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
