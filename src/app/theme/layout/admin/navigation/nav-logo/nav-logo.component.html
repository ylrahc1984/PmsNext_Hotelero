<div class="sidebar-brand-header">
  <a [routerLink]="['/dashboard/default/']" class="b-brand" [attr.aria-label]="branding.productName">
    <span class="brand-system">PMS HOTELERO</span>
    <span class="brand-platform">Hospitality Platform</span>
  </a>
  <button
    type="button"
    class="sidebar-toggle"
    [class.sidebar-toggle--collapsed]="navCollapsed"
    [attr.aria-label]="navCollapsed ? 'Expandir menú lateral' : 'Ocultar menú lateral'"
    [attr.title]="navCollapsed ? 'Expandir menú lateral' : 'Ocultar menú lateral'"
    (click)="navCollapse()"
  >
    <i class="feather" [ngClass]="navCollapsed ? 'icon-chevrons-right' : 'icon-chevrons-left'" aria-hidden="true"></i>
  </button>
</div>
