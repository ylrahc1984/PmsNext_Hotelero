<div
  class="modal fade"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  [ngClass]="{ show: open, 'd-block': open }"
  *ngIf="open"
>
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-0">
            <i class="feather icon-users me-1"></i>
            Seleccionar Cliente
          </h5>
          <small class="text-muted">Busca y selecciona el cliente para asociarlo a la factura.</small>
        </div>
        <button type="button" class="btn-close" aria-label="Close" (click)="onClose()"></button>
      </div>

      <div class="modal-body">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
          <div class="input-group" style="min-width: 280px; flex: 1 1 360px;">
            <span class="input-group-text"><i class="feather icon-search"></i></span>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="clienteSearchTerm"
              name="clienteSearchTerm"
              placeholder="Buscar por código o nombre..."
              autocomplete="off"
              (keyup.enter)="buscarClientes()"
            >
            <button
              type="button"
              class="btn btn-primary rsv-action-btn rsv-action-btn--primary"
              (click)="buscarClientes()"
              [disabled]="clientesLoading"
            >
              <span class="rsv-action-btn__icon" aria-hidden="true">
                <span *ngIf="clientesLoading" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                <i *ngIf="!clientesLoading" class="feather icon-search"></i>
              </span>
              <span>Buscar</span>
            </button>
          </div>
          <button
            type="button"
            class="btn btn-outline-secondary rsv-action-btn rsv-action-btn--outline"
            (click)="limpiarBusquedaClientes()"
            [disabled]="clientesLoading && !clienteSearchTerm"
          >
            <span class="rsv-action-btn__icon" aria-hidden="true">
              <i class="feather icon-x"></i>
            </span>
            <span>Limpiar</span>
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-2">
            <thead class="table-light">
              <tr>
                <th style="width: 140px;">Código</th>
                <th>Nombre</th>
                <th class="text-center" style="width: 140px;">Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let cliente of clientes">
                <td>{{ cliente.codigo }}</td>
                <td>{{ cliente.nombre }}</td>
                <td class="text-center">
                  <button
                    class="btn btn-outline-primary btn-sm rsv-action-btn rsv-action-btn--outline rsv-action-btn--compact"
                    type="button"
                    (click)="seleccionarCliente(cliente)"
                    [disabled]="clientesLoading && clientes.length === 0"
                    title="Seleccionar cliente"
                  >
                    <span class="rsv-action-btn__icon" aria-hidden="true">
                      <i class="feather icon-check"></i>
                    </span>
                    <span>Elegir</span>
                  </button>
                </td>
              </tr>
              <tr *ngIf="clientes.length === 0 && !clientesLoading">
                <td colspan="3" class="text-center text-muted">No hay resultados.</td>
              </tr>
              <tr *ngIf="clientesLoading && clientes.length === 0">
                <td colspan="3" class="text-center text-muted">
                  <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
                  Cargando...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="d-flex justify-content-between align-items-center">
          <small class="text-muted">Registros: {{ clienteTotalRegistros }} · Página {{ clientePage }} / {{ clienteTotalPages }}</small>
          <div class="d-flex gap-2">
            <button
              class="btn btn-outline-secondary btn-sm rsv-action-btn rsv-action-btn--outline rsv-action-btn--compact"
              type="button"
              (click)="paginaAnteriorClientes()"
              [disabled]="clientePage <= 1 || clientesLoading"
            >
              <span class="rsv-action-btn__icon" aria-hidden="true">
                <i class="feather icon-chevron-left"></i>
              </span>
              <span>Anterior</span>
            </button>
            <button
              class="btn btn-outline-secondary btn-sm rsv-action-btn rsv-action-btn--outline rsv-action-btn--compact"
              type="button"
              (click)="paginaSiguienteClientes()"
              [disabled]="clientePage >= clienteTotalPages || clientesLoading"
            >
              <span>Siguiente</span>
              <span class="rsv-action-btn__icon" aria-hidden="true">
                <i class="feather icon-chevron-right"></i>
              </span>
            </button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary rsv-action-btn rsv-action-btn--outline" (click)="onClose()">
          <span class="rsv-action-btn__icon" aria-hidden="true">
            <i class="feather icon-x"></i>
          </span>
          <span>Cerrar</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop fade show" *ngIf="open"></div>
